name: Cursor Metrics

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - cursor-metrics.svg

permissions:
  contents: write

jobs:
  cursor-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Nharington/cursor-metrics@main
        with:
          profile_url: 'https://cursor.com/@nharington'
          output_path: cursor-metrics.svg
          theme: dark

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cursor-metrics.svg
          git diff --cached --quiet || git commit -m "Update cursor-metrics.svg - [Skip GitHub Action]"
          git pull --rebase
          git push
