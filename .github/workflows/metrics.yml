name: Metrics

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - github-metrics.svg
      - cursor-metrics.svg

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Nharington
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Toronto
          config_animations: yes
          output_action: none
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories

      - uses: Nharington/cursor-metrics@main
        with:
          profile_url: https://cursor.com/@nharington
          output_path: cursor-metrics.svg
          theme: dark

      - name: Commit metrics
        run: |
          sudo mv /metrics_renders/github-metrics.svg github-metrics.svg
          sudo chown "$USER" github-metrics.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg cursor-metrics.svg
          git diff --cached --quiet || git commit -m "Update metrics SVGs - [Skip GitHub Action]"
          git pull --rebase
          git push
